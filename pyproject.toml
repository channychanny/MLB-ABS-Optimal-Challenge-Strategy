[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-abs-challenge"
version = "0.1.0"
description = "Data pipeline and decision models for MLB ABS challenge strategy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
abs-challenge = "abs_challenge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

